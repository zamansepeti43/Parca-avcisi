name: Vehicle Catalog Sync

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'data/**'
      - 'scripts/vehicle-catalog/**'
      - 'scripts/catalog-sync.mjs'
      - '.github/workflows/vehicle-catalog-sync.yml'
      - 'src/lib/vehicle-catalog.js'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Merge free vehicle sources
        env:
          FLEETBYTE: '1'
        run: node scripts/vehicle-catalog/merge_turkey_catalog.mjs

      - name: Audit merged catalog
        run: node scripts/vehicle-catalog/audit_catalog.mjs

      - name: Build application
        run: npm install --no-audit --no-fund && npm run build

      - name: Commit catalog changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/vehicle-catalog-merged.json data/vehicle-catalog-audit.json src/lib/vehicle-catalog.js data/vehicle-catalog-sync.json
          if git diff --cached --quiet; then
            echo 'No catalog changes detected.'
          else
            git commit -m 'chore: auto-expand vehicle catalog'
            git push
          fi
