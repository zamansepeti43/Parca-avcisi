name: Vehicle Catalog Sync

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'data/**'
      - 'scripts/catalog-sync.mjs'
      - '.github/workflows/vehicle-catalog-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync and audit catalog
        run: node scripts/catalog-sync.mjs

      - name: Commit catalog changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/vehicle-catalog-sync.json
          if git diff --cached --quiet; then
            echo 'No catalog changes detected.'
          else
            git commit -m 'chore: sync vehicle catalog'
            git push
          fi
