name: Vehicle Catalog + Fitment Sync

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'data/**'
      - 'scripts/vehicle-catalog/**'
      - 'scripts/catalog-sync.mjs'
      - 'scripts/supabase/**'
      - '.github/workflows/vehicle-catalog-sync.yml'
      - 'src/lib/vehicle-catalog.js'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Merge free vehicle sources
        env:
          FLEETBYTE: '1'
        run: node scripts/vehicle-catalog/merge_turkey_catalog.mjs
      - name: Build sync catalog from merged records
        run: node scripts/catalog-sync.mjs
      - name: Audit merged catalog
        run: node scripts/vehicle-catalog/audit_catalog.mjs
      - name: Build application
        run: npm install --no-audit --no-fund && npm run build
      - name: Verify fitment pipeline
        run: |
          test -f scripts/vehicle-catalog/build_fitments.py
          test -f scripts/vehicle-catalog/fitment_normalizer.py
          python -m py_compile scripts/vehicle-catalog/build_fitments.py scripts/vehicle-catalog/fitment_normalizer.py
      - name: Sync vehicles and fitments to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node scripts/supabase/sync-direct-fitments-from-parts.mjs
      - name: Commit catalog changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/vehicle-catalog-merged.json data/vehicle-catalog-audit.json data/vehicle-catalog-sync.json src/lib/vehicle-catalog.js
          if git diff --cached --quiet; then echo 'No catalog changes detected.'; else git commit -m 'chore: auto-expand vehicle catalog'; git pull --rebase origin main; git push; fi
