name: MANN catalog ingest now

on:
  push:
    paths:
      - 'scripts/mann-pdf-ingest.py'
      - '.github/workflows/mann-ingest-now.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF parser
        run: python -m pip install --disable-pip-version-check pypdf
      - name: Ingest official MANN cars and transporters catalog
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MANN_SOURCE_ID: d6646f1f-55c9-4141-beb8-f12b69ae7034
          CATALOG_BATCH_SIZE: 50
        run: python scripts/mann-pdf-ingest.py
