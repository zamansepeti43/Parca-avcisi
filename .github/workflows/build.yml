name: Build

on:
  pull_request:
  push:
    branches:
      - main
      - mvp/backend-foundation
      - mvp/production-sync-hardening
      - release/final-mvp3

permissions:
  contents: read

jobs:
  build:
    name: Install and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
