name: Build

on:
  pull_request:
  push:
    branches:
      - main
      - mvp/backend-foundation
      - mvp/production-sync-hardening
      - release/final-mvp3
      - integration/security-final

permissions:
  contents: read

jobs:
  build:
    name: Install, generate SEO assets and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Generate core SEO sitemap
        run: npm run seo:sitemap
      - name: Validate core sitemap
        run: node -e "const fs=require('fs');const x=fs.readFileSync('public/sitemap.xml','utf8');if(!x.includes('<urlset')||!x.includes('</urlset>'))process.exit(1);console.log('core sitemap bytes:',x.length)"
      - name: Generate vehicle SEO sitemap
        run: npm run seo:vehicle-sitemap
      - name: Validate vehicle sitemap
        run: node -e "const fs=require('fs');const x=fs.readFileSync('public/vehicle-sitemap.xml','utf8');if(!x.includes('<urlset')||!x.includes('</urlset>'))process.exit(1);console.log('vehicle sitemap bytes:',x.length)"
      - run: npm run build
