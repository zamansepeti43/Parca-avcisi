name: Catalog ingestion

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate ingestion configuration
        run: node scripts/catalog-ingest.mjs --check-config
      - name: Run approved catalog batch
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CATALOG_BATCH_SIZE: 500
          CATALOG_MAX_BATCHES: 20
        run: node scripts/catalog-ingest.mjs --source mann-official --supabase --max-batches 20
