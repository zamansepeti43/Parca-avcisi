name: Parça Avcısı - 5 catalog sources

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/catalog-sources.yml'
      - 'scripts/catalog-adapters/**'

permissions:
  contents: read

# Canonical five-source pipeline. Existing products are merged; never delete existing rows.
jobs:
  catalog-source:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        source:
          - kautek
          - kurpar
          - oto-karaman
          - driv
          - continental
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install catalog parser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml
      - name: Validate adapter
        run: test -f "scripts/catalog-adapters/${{ matrix.source }}.mjs"
      - name: Validate Supabase configuration
        env:
          SUPABASE_URL: https://jhlrhmzxcdubsbgkbecx.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          echo "Supabase configuration OK"
      - name: Ingest ${{ matrix.source }}
        env:
          # Supabase project URL is public configuration; service-role key stays secret.
          SUPABASE_URL: https://jhlrhmzxcdubsbgkbecx.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CATALOG_SOURCE: ${{ matrix.source }}
          CATALOG_BATCH_SIZE: 100
          CATALOG_MAX_URLS: 2500
          CATALOG_HTTP_TIMEOUT: 20
          CATALOG_WORKERS: 12
        run: node "scripts/catalog-adapters/${{ matrix.source }}.mjs"
