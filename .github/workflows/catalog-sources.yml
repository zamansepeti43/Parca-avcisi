name: Parça Avcısı - 5 catalog sources

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/catalog-sources.yml'
      - 'scripts/catalog-adapters/**'
      - 'scripts/catalog-ingest.mjs'
      - 'scripts/catalog-ingest-config.json'

permissions:
  contents: read

# Canonical catalog pipeline: exactly five approved sources.
# Existing products must be merged, never deleted or duplicated.
jobs:
  catalog-source:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        source:
          - kautek
          - kurpar
          - oto-karaman
          - driv
          - continental
    steps:
      - uses: actions/checkout@v4
      - name: Validate catalog adapter
        run: |
          test -f "scripts/catalog-adapters/${{ matrix.source }}.mjs"
          echo "Using approved catalog adapter: ${{ matrix.source }}"
      - name: Run catalog adapter
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node "scripts/catalog-adapters/${{ matrix.source }}.mjs"
