name: Parça Avcısı - Turkey priority catalog wave

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/catalog-sources.yml'
      - 'scripts/catalog-adapters/**'
      - 'supabase/migrations/**'

permissions:
  contents: read

jobs:
  catalog-source:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        source:
          - hanparca
          - phira
          - teknorot
          - disa
          - aypar
          - valeo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install catalog parser dependencies
        run: |
          python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml
      - name: Validate adapter
        run: test -f "scripts/catalog-adapters/${{ matrix.source }}.mjs"
      - name: Validate Supabase configuration
        env:
          SUPABASE_URL: https://jhlrhmzxcdubsbgkbecx.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          echo "Supabase configuration OK"
      - name: Ingest ${{ matrix.source }}
        env:
          SUPABASE_URL: https://jhlrhmzxcdubsbgkbecx.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CATALOG_SOURCE: ${{ matrix.source }}
          CATALOG_BATCH_SIZE: 100
          CATALOG_MAX_URLS: 5000
          CATALOG_HTTP_TIMEOUT: 20
          CATALOG_WORKERS: 10
        run: node "scripts/catalog-adapters/${{ matrix.source }}.mjs"
